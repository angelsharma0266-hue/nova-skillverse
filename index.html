<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>NOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bk:#050505;--bk2:#121008;--bk3:#1c1810;--gold:#d4af37;--gold2:#f0d27a;--deep:#8a6a12;--ink:#f6edd0;--mut:#a89968;--ok:#9bd08a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bk);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:20px 18px 150px;background:radial-gradient(120% 60% at 50% -10%,#3a2c07 0,var(--bk) 60%)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.01em}
h2{font-size:28px;margin:6px 0 12px;color:var(--gold2)}h3{font-size:20px;color:var(--gold2)}
p{color:#d9cfae}.mut{color:var(--mut);font-size:13px}
.card{background:linear-gradient(160deg,var(--bk3),var(--bk2));border:1px solid #3d3213;border-radius:20px;padding:16px;margin:12px 0}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--deep));color:#120d00;border:0}
.gold p,.gold h3,.gold .mut{color:#120d00}
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 22px;font:700 15px Manrope;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#120d00;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}.btn.sm{padding:8px 14px;font-size:13px}.btn.full{width:100%}
input,select,textarea{width:100%;background:#0b0905;color:var(--ink);border:1px solid #4a3c14;border-radius:14px;padding:12px;font:inherit;margin:6px 0}
textarea{min-height:90px}label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid #5b4a18;font-size:12px;color:var(--gold2);background:#171207}
.chip.on{background:var(--gold);color:#120d00;border-color:var(--gold)}
.bar{height:8px;border-radius:9px;background:#2a2410;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--deep),var(--gold2));transition:width .6s}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0a0804ee;backdrop-filter:blur(10px);border-top:1px solid #3d3213;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 11px Manrope;padding:6px 0;cursor:pointer}nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--gold2)}
#ai{position:fixed;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--deep));color:#120d00;font-size:22px;box-shadow:0 6px 24px #d4af3755;cursor:pointer}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0}
.disc{width:112px;height:112px;border-radius:50%;background:#000;border:3px solid var(--gold);box-shadow:0 0 0 6px #000,0 0 0 8px var(--deep),0 0 40px #d4af3744;display:flex;align-items:center;justify-content:center}
.word{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;color:var(--gold2);letter-spacing:.14em;display:flex;align-items:center}
.word .o{position:relative;display:inline-block;width:.9em;height:.9em;border:2px solid var(--gold2);border-radius:50%;margin:0 2px}
.word .o::after{content:'✦';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.5em;color:var(--gold)}
.big{font-size:44px;line-height:1.05;text-align:center}
.steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.q{font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:700;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#0b0905;border:1px solid #4a3c14;color:var(--ink);border-radius:14px;padding:12px;margin:7px 0;font:inherit;cursor:pointer}
.opt:active{border-color:var(--gold)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#120d00;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;max-width:90%}
.vid{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--deep);position:relative}
.vid iframe,.vid video{width:100%;height:100%;border:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:20px;background:radial-gradient(circle at 80% 0,#3a2c07,#000 70%)}
.slide h3{font-size:24px}.tag{font-size:11px;color:var(--mut)}
.call{height:62vh;border-radius:16px;overflow:hidden;border:1px solid var(--gold)}.call iframe{width:100%;height:100%;border:0}
.warn{border-left:3px solid var(--gold);padding:8px 12px;background:#17120640;border-radius:0 12px 12px 0;color:var(--mut);font-size:12.5px;margin:10px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>
<button id="ai" aria-label="NOVA AI" onclick="aiOpen()">✦</button>
<nav id="nav"></nav>
<script>
const SKILLS=['Communication','Creativity','Leadership','Design','Coding','Business','Finance','Marketing','Writing','Public speaking','Teaching','Problem solving','Teamwork','Entrepreneurship','Art','Music','Sports'];
let mem=null;
const load=()=>{try{return JSON.parse(localStorage.getItem('nova_v1')||'null')}catch(e){return mem}};
let DB=load()||{users:[],me:null,feedback:[],urls:{},listings:[],bookings:[]};
const save=()=>{try{localStorage.setItem('nova_v1',JSON.stringify(DB))}catch(e){mem=DB}};
const me=()=>DB.users.find(u=>u.id===DB.me);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const LV=[[85,'Verified'],[65,'Advanced'],[45,'Intermediate'],[25,'Developing'],[0,'Beginner']];
const lvl=s=>LV.find(l=>s>=l[0])[1];
const ulevel=xp=>Math.floor(xp/300)+1;
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- content ---------- */
const QUIZ=[
['A friend needs help planning a school event. You…',[['Take charge and assign roles',{Leadership:12,Teamwork:6}],['Design the poster and theme',{Design:12,Creativity:8}],['Make a budget sheet',{Finance:12,Business:6}],['Pitch it to everyone',{'Public speaking':12,Communication:8}]]],
['Pick a free Saturday project',[['Build a small website',{Coding:14,'Problem solving':6}],['Record and edit a short video',{Creativity:10,Marketing:8}],['Write a story or article',{Writing:14,Creativity:4}],['Teach a friend something',{Teaching:14,Communication:6}]]],
['A team disagrees. You…',[['Listen and find middle ground',{Teamwork:12,Communication:8}],['Break it into smaller problems',{'Problem solving':14}],['Decide quickly and move on',{Leadership:12}],['Sketch the options visually',{Art:8,Design:8}]]],
['Which idea excites you most?',[['A tiny business selling something',{Entrepreneurship:14,Business:6}],['A song or beat',{Music:14}],['A sports training plan',{Sports:14,Leadership:4}],['A viral ad campaign',{Marketing:14,Creativity:6}]]],
['Someone gives you ₹1,000 to grow. You…',[['Test a product with friends',{Entrepreneurship:12,Business:8}],['Save and track every rupee',{Finance:14}],['Buy tools to learn a craft',{Art:6,Creativity:6,Coding:4}],['Promote a cause online',{Marketing:10,Communication:6}]]],
['Mini challenge: you have 10 seconds to introduce yourself. You…',[['Say it confidently on camera',{'Public speaking':12,Communication:6}],['Write a punchy one-liner',{Writing:12}],['Make a quick logo',{Design:10,Art:6}],['Ask them about themselves first',{Communication:10,Teamwork:6}]]]
];
const CH=[
{id:'c1',t:'Create a 30-second advertisement',cat:'Marketing',d:'Easy',xp:100,sk:{Marketing:8,Creativity:6},brief:'Script and shoot (or storyboard) a 30-second ad for any everyday product.'},
{id:'c2',t:'Design a poster for a school event',cat:'Design',d:'Easy',xp:80,sk:{Design:9,Creativity:5},brief:'Upload an image or PDF of your poster, plus a line on why you chose the layout.'},
{id:'c3',t:'Write a 300-word article',cat:'Writing',d:'Easy',xp:80,sk:{Writing:10},brief:'Pick a topic you care about. Hook the reader in the first line.'},
{id:'c4',t:'Give a 60-second speech',cat:'Public speaking',d:'Medium',xp:120,sk:{'Public speaking':10,Communication:6},brief:'Record a video or paste a link. Open with a story, end with one clear ask.'},
{id:'c5',t:'Solve a business problem',cat:'Business',d:'Medium',xp:150,sk:{Business:9,'Problem solving':8},brief:'A cafe loses customers after 6pm. Propose three fixes and pick one.'},
{id:'c6',t:'Create a monthly financial plan',cat:'Finance',d:'Medium',xp:150,sk:{Finance:10},brief:'Plan ₹5,000 across needs, wants and savings. Explain each choice.'},
{id:'c7',t:'Edit a 60-second video',cat:'Editing',d:'Medium',xp:160,sk:{Creativity:8,Design:6},brief:'Cut raw clips into a tight story with sound. Share a link or upload the file.'},
{id:'c8',t:'Build a one-page website',cat:'Coding',d:'Hard',xp:220,sk:{Coding:12,'Problem solving':6},brief:'Share a live link or repo. Say what you built and what was hardest.'}
];
const LESSONS=[
{id:'l1',t:'Scripting a short video',cat:'Scripting',by:'Sample lesson',steps:[['Start with the hook','The first 3 seconds decide if people stay. Open with a question, a surprise or a bold claim.'],['One idea per video','Write the single sentence your viewer should remember. Cut everything that does not serve it.'],['Write for the ear','Read your script aloud. If you stumble, rewrite. Short sentences win.'],['Match words to visuals','Draw a two-column table: what we hear, what we see. Every line needs a shot.'],['End with one action','Tell viewers exactly what to do next: follow, try it, reply.']]},
{id:'l2',t:'Communicating with clarity',cat:'Communication',by:'Sample lesson',steps:[['Know your point','Before you speak, finish this sentence: "I want them to understand that…"'],['Structure: point, reason, example','Say the point first, back it with one reason, make it real with one example.'],['Listen to reply, not to wait','Repeat back what you heard in your own words before answering.'],['Use your voice','Slow down, pause after key ideas, vary your pitch.'],['Ask for feedback','End with "What was unclear?" and improve the next time.']]},
{id:'l3',t:'Video editing basics',cat:'Editing',by:'Sample lesson',steps:[['Organise before you cut','Name clips, sort them into folders, and mark your best takes first.'],['Cut on action','Switch shots in the middle of a movement so the cut feels invisible.'],['Pace with sound','Audio carries the edit. Fix levels first, then add music underneath the voice.'],['Trim the fat','Remove the first and last second of most clips. Tighter is stronger.'],['Export for the platform','Vertical 9:16 for reels, 16:9 for YouTube. Check captions before you post.']]}
];
const SAMPLE_LIST=[
{id:'s1',by:'Aarav (sample)',teach:'Video Editing',wants:'Excel',desc:'I edit reels and shorts. Sample listing for demonstration.',level:'Intermediate',dur:45,price:0,sample:1},
{id:'s2',by:'Meera (sample)',teach:'Excel',wants:'Video Editing',desc:'Spreadsheets for school projects. Sample listing for demonstration.',level:'Intermediate',dur:45,price:0,sample:1},
{id:'s3',by:'Kabir (sample)',teach:'Public Speaking',wants:'Design',desc:'Debate and stage practice. Sample listing for demonstration.',level:'Advanced',dur:30,price:149,sample:1}
];
const OPPS=[
['Competition','Youth Pitch Challenge','Pitch an idea in 3 minutes.',['Entrepreneurship','Public speaking','Business']],
['Workshop','Short Video Storytelling','Learn scripting and editing in a weekend.',['Creativity','Writing','Marketing']],
['Mentorship','Design Mentor Circle','Monthly feedback on your portfolio.',['Design','Art','Creativity']],
['Project','Community App Team','Join a student-built app project.',['Coding','Teamwork','Problem solving']],
['Scholarship','Money Basics Resource Pack','Free finance guides for teens.',['Finance','Business']],
['Youth program','Young Leaders Camp','Leadership and teamwork training.',['Leadership','Teamwork','Communication']]
];
const CAREERS=[
['Content creator / video producer',['Creativity','Writing','Marketing','Design'],'Storytelling, editing, audience growth'],
['Software developer',['Coding','Problem solving','Teamwork'],'Programming, debugging, collaboration'],
['Marketing specialist',['Marketing','Communication','Creativity'],'Campaigns, analytics, copywriting'],
['Entrepreneur',['Entrepreneurship','Business','Leadership','Finance'],'Validation, selling, budgeting'],
['Educator / trainer',['Teaching','Communication','Public speaking'],'Lesson design, explaining, patience'],
['Designer / illustrator',['Design','Art','Creativity'],'Layout, colour, tools'],
['Finance analyst',['Finance','Problem solving','Business'],'Modelling, reporting, reasoning'],
['Coach / sports professional',['Sports','Leadership','Teamwork'],'Training design, motivation']
];
const BADGES=[
['First Challenge','Complete one challenge',u=>u.done.length>=1],
['Skill Builder','Reach Developing in any skill',u=>Object.values(u.skills).some(s=>s>=25)],
['Team Player','Join a project or exchange',u=>u.log.some(l=>l.k==='team')],
['Teacher','Publish a teaching listing',u=>DB.listings.some(l=>l.uid===u.id)],
['Creator','Complete 3 challenges',u=>u.done.length>=3],
['Problem Solver','Score 80+ on a Business or Coding challenge',u=>u.log.some(l=>l.k==='ch'&&l.score>=80&&['Business','Coding'].includes(l.cat))],
['Rising Star','Reach level 3',u=>ulevel(u.xp)>=3],
['Portfolio Builder','Add 2 portfolio items',u=>u.portfolio.length>=2]
];

/* ---------- state / helpers ---------- */
let tab='home',sub=null,qi=0,qacc={};
const go=(t,s=null)=>{tab=t;sub=s;render();window.scrollTo(0,0)};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2400)}
function award(u,xp,sk,entry){
 u.xp+=xp;for(const k in sk)u.skills[k]=Math.min(100,(u.skills[k]||0)+sk[k]);
 const d=today(),last=u.lastDay;
 if(last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);u.streak=last===y?u.streak+1:1;u.lastDay=d}
 u.log.push({t:Date.now(),xp,...entry});
 BADGES.forEach(b=>{if(!u.badges.includes(b[0])&&b[2](u)){u.badges.push(b[0]);toast('Badge unlocked: '+b[0])}});
 save();
}
const bars=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span class="mut">${v} · ${lvl(v)}</span></div><div class="bar"><i style="width:${v}%"></i></div>`).join('');
const logoSm=()=>`<div class="word" style="font-size:19px">N<span class="o"></span>VA</div>`;
const guard=()=>{if(!me()){go('auth');return false}return true};

/* ---------- views ---------- */
function vHome(){const u=me();return `
<div class="logo"><div class="disc"><div class="word" style="font-size:28px">N<span class="o"></span>VA</div></div></div>
<h1 class="big">NOVA</h1>
<p class="serif" style="text-align:center;font-size:21px;color:var(--gold2);margin:8px 0">A journey from potential to possibility.</p>
<p style="text-align:center;margin:12px 4px">Discover what you're good at. Learn useful skills through challenges. Build proof of your abilities. Connect, collaborate, teach and discover where your skills can take you.</p>
<div style="text-align:center"><button class="btn" onclick="${u?"go('discover')":"go('auth')"}">${u?'Continue your journey':'Start your journey'}</button></div>
<div class="steps">${['Discover','Learn','Practice','Prove','Collaborate','Teach','Earn','Explore'].map((s,i)=>`<span class="chip">${s}</span>${i<7?'<span class="mut">›</span>':''}`).join('')}</div>
<div class="card gold"><p class="mut">Today's mission</p><h3>Create a 30-second advertisement</h3><p>+100 XP · Marketing + Creativity</p><br><button class="btn sm" style="background:#120d00;color:var(--gold2)" onclick="openCh('c1')">Take the mission</button></div>
${u?`<div class="card"><div class="row"><b>Level ${ulevel(u.xp)}</b><span class="mut">${u.xp} XP · ${u.streak||0}-day streak</span></div><div class="bar"><i style="width:${u.xp%300/3}%"></i></div></div>`:''}
<h2>Learn it like a game</h2>
<div class="card"><p>Daily missions, XP, skill levels, streaks and badges. Every challenge you finish raises your XP and the Skill DNA scores it demonstrates, and unlocks harder challenges.</p></div>`}

function vAuth(){const m=sub||'signup';return `
<div class="logo"><div class="disc" style="width:84px;height:84px"><div class="word" style="font-size:19px">N<span class="o"></span>VA</div></div></div>
<h2 style="text-align:center">${m==='signup'?'Create your account':m==='login'?'Welcome back':'Reset password'}</h2>
<div class="card">
${m==='signup'?`<label>Name</label><input id="an"><label>I am a</label><select id="at"><option>Teen / Student</option><option>School / College</option><option>Business / Organisation</option></select><label>Age</label><input id="aa" type="number" min="5" max="99">`:''}
<label>Email</label><input id="ae" type="email" autocomplete="email">
${m!=='forgot'?`<label>Password</label><input id="ap" type="password" autocomplete="${m==='login'?'current-password':'new-password'}">`:''}
<br><button class="btn full" onclick="auth('${m}')">${m==='signup'?'Sign up':m==='login'?'Log in':'Reset password'}</button>
<p class="mut" style="text-align:center;margin-top:12px">${m==='signup'?`Have an account? <a href="#" style="color:var(--gold2)" onclick="go('auth','login');return false">Log in</a>`:`<a href="#" style="color:var(--gold2)" onclick="go('auth','signup');return false">Create account</a> · <a href="#" style="color:var(--gold2)" onclick="go('auth','forgot');return false">Forgot password</a>`}</p></div>
<div class="warn">Demo mode: accounts live on this device only. Real sign-up, password reset emails and cross-device data need a backend such as Supabase.</div>`}
function auth(m){
 const e=(document.getElementById('ae').value||'').trim().toLowerCase(),p=(document.getElementById('ap')||{}).value;
 if(!/\S+@\S+\.\S+/.test(e))return toast('Enter a valid email');
 if(m==='forgot'){const u=DB.users.find(x=>x.email===e);if(!u)return toast('No account with that email');const np=prompt('Enter a new password (min 6 characters)');if(np&&np.length>=6){u.pass=btoa(np);save();toast('Password updated');go('auth','login')}return}
 if(!p||p.length<6)return toast('Password needs 6+ characters');
 if(m==='login'){const u=DB.users.find(x=>x.email===e&&x.pass===btoa(p));if(!u)return toast('Email or password is wrong');if(u.suspended)return toast('This account is suspended');DB.me=u.id;save();return go(u.dna?'profile':'discover')}
 const n=document.getElementById('an').value.trim(),a=+document.getElementById('aa').value;
 if(!n)return toast('Add your name');if(!a)return toast('Add your age');
 if(DB.users.find(x=>x.email===e))return toast('That email is already registered');
 const u={id:uid(),name:n,email:e,pass:btoa(p),type:document.getElementById('at').value,age:a,minor:a<18,skills:{},xp:0,streak:0,badges:[],done:[],log:[],portfolio:[],plan:null,dna:false,privacy:{showEmail:false,showCity:false}};
 DB.users.push(u);DB.me=u.id;save();go('discover');
 if(u.minor)toast('Under 18: a guardian must approve paid sessions')
}

function vDiscover(){if(!guard())return'';const u=me();
 if(sub==='quiz'){const q=QUIZ[qi];return `<p class="mut">Question ${qi+1} of ${QUIZ.length}</p><div class="bar"><i style="width:${qi/QUIZ.length*100}%"></i></div><div class="q">${esc(q[0])}</div>${q[1].map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o[0])}</button>`).join('')}`}
 if(!u.dna)return `<h2>Discover your Skill DNA</h2><div class="card"><p>Six quick questions and mini-challenges give you a starting map across 17 skills. It sharpens as you complete real challenges.</p><br><button class="btn" onclick="qi=0;qacc={};go('discover','quiz')">Start discovery</button></div>${dnaNote()}`;
 const sorted=Object.entries(u.skills).sort((a,b)=>b[1]-a[1]);
 const top=sorted.slice(0,3),dev=sorted.filter(s=>s[1]>=15&&s[1]<45).slice(0,3),low=SKILLS.map(s=>[s,u.skills[s]||0]).sort((a,b)=>a[1]-b[1]).slice(0,3);
 return `<h2>Your Skill DNA</h2>
 <div class="card gold"><p class="mut">Strengths</p><h3>${top.map(t=>esc(t[0])).join(' · ')}</h3></div>
 <div class="card">${bars(Object.fromEntries(SKILLS.map(s=>[s,u.skills[s]||0])))}</div>
 <div class="card"><b>Being developed</b><p>${dev.map(d=>esc(d[0])).join(', ')||'Complete challenges to build this list'}</p><br><b>Areas to improve</b><p>${low.map(d=>esc(d[0])).join(', ')}</p></div>
 <h3>Recommended challenges</h3>${CH.filter(c=>!u.done.includes(c.id)).sort((a,b)=>Math.max(...Object.keys(b.sk).map(k=>u.skills[k]||0))-Math.max(...Object.keys(a.sk).map(k=>u.skills[k]||0))).slice(0,3).map(chCard).join('')||'<p class="mut">You finished them all.</p>'}
 <div class="card"><b>Explore careers</b><br><button class="btn sm ghost" style="margin-top:8px" onclick="go('opp','careers')">See possible directions</button></div>
 <button class="btn ghost sm" onclick="qi=0;qacc={};go('discover','quiz')">Retake discovery</button>${dnaNote()}`}
const dnaNote=()=>`<div class="warn">Skill DNA is guidance, not a scientific prediction or professional assessment.</div>`;
function pick(i){const o=QUIZ[qi][1][i][1];for(const k in o)qacc[k]=(qacc[k]||0)+o[k];qi++;
 if(qi>=QUIZ.length){const u=me();for(const k in qacc)u.skills[k]=Math.max(u.skills[k]||0,Math.min(60,qacc[k]*2));u.dna=true;award(u,150,{},{k:'dna'});toast('+150 XP · Skill DNA ready');go('discover')}else render()}

const chCard=c=>`<div class="card"><div class="row"><h3>${esc(c.t)}</h3><span class="chip">+${c.xp} XP</span></div><p class="mut">${c.cat} · ${c.d}</p><div class="wrap" style="margin:8px 0">${Object.keys(c.sk).map(k=>`<span class="chip">${k}</span>`).join('')}</div><button class="btn sm" onclick="openCh('${c.id}')">Open</button></div>`;
function openCh(id){if(!guard())return;go('create',id)}
let cf='All';
function vCreate(){if(!guard())return'';const u=me();
 if(sub){const c=CH.find(x=>x.id===sub),r=u.log.filter(l=>l.k==='ch'&&l.id===c.id).pop();
  return `<button class="btn sm ghost" onclick="go('create')">Back</button><h2 style="margin-top:12px">${esc(c.t)}</h2><p>${esc(c.brief)}</p><p class="mut">${c.cat} · ${c.d} · +${c.xp} XP</p>
  ${r?`<div class="card gold"><h3>Score ${r.score}/100</h3><p><b>Strengths:</b> ${esc(r.str)}</p><p><b>To improve:</b> ${esc(r.imp)}</p><p><b>Next:</b> ${esc(r.next)}</p></div>`:''}
  <div class="card"><label>Your work (text)</label><textarea id="st" placeholder="Describe or paste your work"></textarea><label>Link (optional)</label><input id="sl" placeholder="https://"><label>File (image, PDF or video)</label><input id="sf" type="file" accept="image/*,application/pdf,video/*"><br><button class="btn full" onclick="submitCh('${c.id}')">${r?'Submit again':'Submit work'}</button></div>
  <div class="warn">Demo scoring is automatic and based on effort and detail. Real reviews, file storage and expert feedback need a backend.</div>`}
 const cats=['All',...new Set(CH.map(c=>c.cat))];
 return `<h2>Create</h2><div class="wrap">${cats.map(c=>`<span class="chip ${cf===c?'on':''}" onclick="cf='${c}';render()">${c}</span>`).join('')}</div>${CH.filter(c=>cf==='All'||c.cat===cf).map(chCard).join('')}`}
function submitCh(id){const u=me(),c=CH.find(x=>x.id===id),t=document.getElementById('st').value.trim(),l=document.getElementById('sl').value.trim(),f=document.getElementById('sf').files[0];
 if(!t&&!l&&!f)return toast('Add text, a link or a file');
 if(l&&!/^https?:\/\//.test(l))return toast('Links must start with http');
 let s=50+Math.min(25,Math.floor(t.length/12))+(l?10:0)+(f?10:0);s=Math.min(96,s);
 const first=!u.done.includes(id);
 const r={k:'ch',id,cat:c.cat,score:s,str:s>=75?'Clear, detailed and complete':'You got started and shared real work',imp:s>=75?'Push for a stronger opening and a clear result':'Add more detail and show evidence (link or file)',next:(CH.find(x=>x.cat!==c.cat&&!u.done.includes(x.id)&&x.id!==id)||{t:'Repeat at a harder level'}).t};
 if(first)u.done.push(id);
 const sk={};for(const k in c.sk)sk[k]=Math.round(c.sk[k]*s/100*(first?1:.3));
 award(u,first?c.xp:Math.round(c.xp/4),sk,r);
 u.portfolio.push({id:uid(),title:c.t,desc:t.slice(0,200),skill:c.cat,date:today(),evidence:l||(f?f.name:'Text'),result:s+'/100',vis:'Private'});save();
 toast('Scored '+s+' · XP added');render()}

function vLearn(){if(!guard())return'';const u=me();const m=sub||'lessons';
 const tabs=`<div class="wrap" style="margin-bottom:8px">${[['lessons','Lessons'],['teachers','Teachers'],['teach','Teach & earn'],['sessions','My sessions']].map(t=>`<span class="chip ${m===t[0]?'on':''}" onclick="go('learn','${t[0]}')">${t[1]}</span>`).join('')}</div>`;
 if(m==='lessons')return `<h2>Learn</h2>${tabs}<p class="mut">Example lessons on scripting, communication and editing. Open one to watch.</p>${LESSONS.map(l=>`<div class="card"><span class="chip">${l.cat}</span><h3 style="margin:8px 0">${esc(l.t)}</h3><p class="mut">${l.steps.length} steps · ${l.by}</p><br><button class="btn sm" onclick="go('learn','L'+'${l.id}')">Watch lesson</button></div>`).join('')}`;
 if(m[0]==='L'){const l=LESSONS.find(x=>x.id===m.slice(1));return `<button class="btn sm ghost" onclick="go('learn','lessons')">Back</button><h2 style="margin-top:10px">${esc(l.t)}</h2>${player(l)}
  <div class="card"><label>Use your own video (YouTube or .mp4 link)</label><input id="vu" value="${esc(DB.urls[l.id]||'')}" placeholder="https://"><button class="btn sm" onclick="setUrl('${l.id}')">Save video</button></div>
  <button class="btn full" onclick="finishLesson('${l.id}')">Mark lesson complete</button>`}
 if(m==='teachers'){const all=[...DB.listings,...SAMPLE_LIST];return `<h2>Learn</h2>${tabs}<input id="q" placeholder="Search skill or teacher" oninput="render()" value="${esc(window._q||'')}">${all.filter(l=>!window._q||(l.teach+l.by+l.desc).toLowerCase().includes(window._q.toLowerCase())).map(l=>`<div class="card"><div class="row"><h3>${esc(l.teach)}</h3><span class="chip">${l.price?'₹'+l.price:'Skill exchange'}</span></div><p class="mut">${esc(l.by)} · ${esc(l.level)} · ${l.dur} min</p><p>${esc(l.desc)}</p>${l.wants?`<p class="mut">Wants to learn: ${esc(l.wants)}</p>`:''}<br><button class="btn sm" onclick="book('${l.id}')">${l.price?'Request session':'Request exchange'}</button></div>`).join('')}${matches(u)}`}
 if(m==='teach')return `<h2>Teach & earn</h2>${tabs}<div class="card"><label>Skill you can teach</label><input id="tt"><label>Skill you want to learn (for exchanges)</label><input id="tw"><label>Description</label><textarea id="td"></textarea><label>Level</label><select id="tl"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><label>Duration (min)</label><input id="tdu" type="number" value="45"><label>Price in ₹ (0 = exchange only)</label><input id="tp" type="number" value="0"><br><button class="btn full" onclick="addListing()">Publish listing</button></div><div class="warn">${u.minor?'You are under 18: paid sessions need guardian consent before going live. ':''}Never share phone numbers or addresses. Sessions run inside NOVA.</div>`;
 const mine=DB.bookings.filter(b=>b.stu===u.id||b.teacher===u.id);
 return `<h2>My sessions</h2>${tabs}${mine.map(b=>`<div class="card"><h3>${esc(b.skill)}</h3><p class="mut">With ${esc(b.withName)} · Room code <b>${b.room}</b></p><button class="btn sm" onclick="go('call','${b.room}')">Join video call</button></div>`).join('')||'<p class="mut">No sessions yet. Request one from Teachers.</p>'}<div class="card"><label>Have a room code from your session partner?</label><input id="rc" placeholder="e.g. K4X9PQ"><button class="btn sm" onclick="go('call',document.getElementById('rc').value.trim().toUpperCase())">Join with code</button></div>`}
function matches(u){const mine=DB.listings.filter(l=>l.uid===u.id);if(!mine.length)return'';const all=[...DB.listings,...SAMPLE_LIST].filter(l=>l.uid!==u.id);
 const m=all.filter(o=>mine.some(l=>l.wants&&o.teach.toLowerCase()===l.wants.toLowerCase()&&o.wants&&o.wants.toLowerCase()===l.teach.toLowerCase()));
 return m.length?`<h3>Skill matches</h3>${m.map(o=>`<div class="card gold"><h3>${esc(o.by)}</h3><p>Teaches ${esc(o.teach)} and wants ${esc(o.wants)}. A swap with you.</p></div>`).join('')}`:''}
function addListing(){const u=me(),t=document.getElementById('tt').value.trim();if(!t)return toast('Add the skill');
 DB.listings.push({id:uid(),uid:u.id,by:u.name,teach:t,wants:document.getElementById('tw').value.trim(),desc:document.getElementById('td').value.trim(),level:document.getElementById('tl').value,dur:+document.getElementById('tdu').value||45,price:+document.getElementById('tp').value||0});
 award(u,60,{Teaching:6},{k:'teach'});toast('Listing published');go('learn','teachers')}
function book(id){const u=me(),l=[...DB.listings,...SAMPLE_LIST].find(x=>x.id===id);
 if(l.uid===u.id)return toast('This is your own listing');
 if(l.price&&u.minor&&!confirm('Paid sessions for under-18s need guardian approval. Continue and notify your guardian?'))return;
 const room=uid()+uid().slice(0,2);DB.bookings.push({id:uid(),room,skill:l.teach,stu:u.id,teacher:l.uid||null,withName:l.by});
 if(!l.price)award(u,40,{Teamwork:4},{k:'team'});else save();
 toast('Session created · room '+room);go('learn','sessions')}
function setUrl(id){DB.urls[id]=document.getElementById('vu').value.trim();save();toast('Video saved');render()}
function finishLesson(id){const u=me();if(u.log.some(l=>l.k==='lesson'&&l.id===id))return toast('Already completed');award(u,50,{Communication:3,Creativity:3},{k:'lesson',id});toast('+50 XP');go('learn','lessons')}
function player(l){const url=DB.urls[l.id];
 if(url){const y=url.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  if(y)return `<div class="vid"><iframe src="https://www.youtube.com/embed/${y[1]}" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`;
  if(/^https?:\/\//.test(url))return `<div class="vid"><video src="${esc(url)}" controls playsinline></video></div>`}
 return `<div class="vid" id="pl"></div><div class="row" style="margin-top:8px"><button class="btn sm" id="pp" onclick="togglePlay('${l.id}')">Play</button><div class="bar" style="flex:1;margin:0"><i id="pg" style="width:0"></i></div></div><p class="mut">Animated sample lesson. Add your own video below to replace it.</p>`}
let tm=null,si=0;
function togglePlay(id){const l=LESSONS.find(x=>x.id===id),box=document.getElementById('pl'),b=document.getElementById('pp');
 if(tm){clearInterval(tm);tm=null;b.textContent='Play';return}
 b.textContent='Pause';if(si>=l.steps.length)si=0;
 const show=()=>{const s=l.steps[si];box.innerHTML=`<div class="slide"><span class="tag">Step ${si+1} of ${l.steps.length}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`;document.getElementById('pg').style.width=((si+1)/l.steps.length*100)+'%'};
 show();tm=setInterval(()=>{si++;if(si>=l.steps.length){clearInterval(tm);tm=null;b.textContent='Replay';si=0;return}show()},5500)}

function vCall(){if(!guard())return'';const r=sub;if(!r||r.length<4)return `<h2>Video call</h2><p>Enter a valid room code from My sessions.</p><button class="btn" onclick="go('learn','sessions')">My sessions</button>`;
 const u=me();return `<h2>Live session</h2><p class="mut">Room <b>${esc(r)}</b>. Share this code with your partner in NOVA messages. Both of you open My sessions and join.</p>
 <div class="call"><iframe allow="camera;microphone;fullscreen;display-capture;autoplay" src="https://meet.jit.si/NOVA-${encodeURIComponent(r)}#userInfo.displayName=%22${encodeURIComponent(u.name)}%22&config.prejoinConfig.enabled=true"></iframe></div>
 <br><button class="btn ghost full" onclick="go('learn','sessions')">Leave session</button>
 <div class="warn">Powered by Jitsi Meet (free). Allow camera and microphone when asked. Test on two devices before presenting.</div>`}

function vOpp(){if(!guard())return'';const u=me();
 if(sub==='careers'){const sc=CAREERS.map(c=>[c,Math.round(c[1].reduce((a,k)=>a+(u.skills[k]||0),0)/c[1].length)]).sort((a,b)=>b[1]-a[1]).slice(0,4);
  return `<button class="btn sm ghost" onclick="go('opp')">Back</button><h2 style="margin-top:10px">Career directions</h2><p class="mut">Possible paths based on your Skill DNA and activity. None are guaranteed.</p>
  ${sc.map(([c,s])=>{const need=c[1].filter(k=>(u.skills[k]||0)<45);const ch=CH.filter(x=>Object.keys(x.sk).some(k=>c[1].includes(k))&&!u.done.includes(x.id)).slice(0,2);return `<div class="card"><div class="row"><h3>${c[0]}</h3><span class="chip">${s}% match</span></div><p><b>Why:</b> your strongest overlap is ${c[1].filter(k=>(u.skills[k]||0)>0).sort((a,b)=>u.skills[b]-u.skills[a]).slice(0,2).join(' and ')||'still forming'}.</p><p><b>Skills still needed:</b> ${need.join(', ')||'Keep deepening what you have'}</p><p><b>Learning path:</b> ${c[2]}</p><p class="mut">Try: ${ch.map(x=>x.t).join(' · ')||'More advanced challenges'}</p></div>`}).join('')}${dnaNote()}`}
 const top=Object.entries(u.skills).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
 const o=OPPS.map(x=>[x,x[3].filter(k=>top.includes(k)).length]).sort((a,b)=>b[1]-a[1]);
 return `<h2>Opportunities</h2><button class="btn sm ghost" onclick="go('opp','careers')">Career directions</button><div class="warn">Sample opportunities for demonstration. Opportunities are never a guarantee of a job or placement.</div>${o.map(([x,s])=>`<div class="card"><span class="chip">${x[0]}</span>${s?' <span class="chip on">Recommended for you</span>':''}<h3 style="margin:8px 0">${x[1]}</h3><p>${x[2]}</p></div>`).join('')}`}

function vProfile(){if(!guard())return'';const u=me(),L=u.log;let c=0;const pts=L.map(l=>c+=l.xp);const max=Math.max(1,c);
 const poly=pts.length>1?pts.map((p,i)=>`${i/(pts.length-1)*300},${70-p/max*65}`).join(' '):'';
 return `<div class="card gold"><div class="row"><div><h3 style="font-size:26px">${esc(u.name)}</h3><p class="mut">${esc(u.type)} · Level ${ulevel(u.xp)}</p></div><div style="text-align:right"><b style="font-size:24px">${u.xp}</b><p class="mut">XP · ${u.streak||0}-day streak</p></div></div></div>
 <h3>Skill progress</h3><div class="card">${bars(Object.fromEntries(SKILLS.filter(s=>u.skills[s]).map(s=>[s,u.skills[s]])))||'<p class="mut">Complete discovery first.</p>'}</div>
 <h3>XP over time</h3><div class="card">${poly?`<svg viewBox="0 0 300 75" width="100%"><polyline fill="none" stroke="#d4af37" stroke-width="2.5" points="${poly}"/></svg>`:'<p class="mut">Finish two activities to see your graph.</p>'}<p class="mut">${u.done.length} challenges · ${u.portfolio.length} portfolio items · ${L.filter(l=>l.k==='lesson').length} lessons</p></div>
 <h3>Badges</h3><div class="card wrap">${BADGES.map(b=>`<span class="chip ${u.badges.includes(b[0])?'on':''}" title="${b[1]}">${b[0]}</span>`).join('')}</div>
 <h3>Proof portfolio</h3>${u.portfolio.map((p,i)=>`<div class="card"><div class="row"><b>${esc(p.title)}</b><span class="chip">${p.result}</span></div><p class="mut">${esc(p.skill)} · ${p.date} · ${esc(p.evidence)}</p><select onchange="me().portfolio[${i}].vis=this.value;save()">${['Private','Connections','Public'].map(v=>`<option ${p.vis===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<p class="mut">Submit a challenge to add your first item.</p>'}
 <h3>Plans</h3>${plans()}
 <h3>Privacy</h3><div class="card"><p class="mut">Your email and exact location are never shown publicly.</p>${u.minor?'<p class="mut">Under 18: messaging is limited and paid sessions need guardian consent.</p>':''}</div>
 <h3>Voices of NOVA</h3><div class="card"><p class="mut">Sample testimonial — for demonstration only.</p><p>"The challenges made practising skills feel like a game."</p></div>
 <div class="card"><label>Rating</label><select id="fr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>What you liked</label><input id="fl"><label>What should improve</label><input id="fi"><label><input type="checkbox" id="fa" style="width:auto"> Submit anonymously</label><br><button class="btn sm" onclick="sendFb()">Send feedback</button></div>
 <br><button class="btn ghost full" onclick="DB.me=null;save();go('home')">Log out</button>`}
function plans(){const u=me(),P=[['Starter','₹1 one-time','Introductory access. Charged once, never recurring.'],['Plus','₹49/month or ₹499/year','Advanced Skill DNA, more challenges, analytics, more AI questions, career insights, portfolio customisation.'],['Pro','₹99/month or ₹999/year','Everything in Plus, plus advanced career roadmap, premium challenges, extra AI support, advanced portfolio.']];
 return P.map(p=>`<div class="card ${u.plan===p[0]?'gold':''}"><div class="row"><h3>NOVA ${p[0].toUpperCase()}</h3></div><p><b>${p[1]}</b></p><p class="mut">${p[2]}</p><button class="btn sm" onclick="choosePlan('${p[0]}')">${u.plan===p[0]?'Selected':'Choose'}</button></div>`).join('')+`<div class="warn">No free trials. Payments are not connected in this build. Selecting a plan only saves your choice. Live Indian payments need a provider like Razorpay, with guardian consent for under-18s.</div>`}
function choosePlan(p){me().plan=p;save();toast(p+' selected');render()}
function sendFb(){const u=me();DB.feedback.push({rating:+document.getElementById('fr').value,like:document.getElementById('fl').value,improve:document.getElementById('fi').value,by:document.getElementById('fa').checked?'anonymous':u.id,t:Date.now()});save();toast('Thank you for the feedback');render()}

/* ---------- AI helper (local, rule-based) ---------- */
function aiOpen(){const u=me();const q=prompt('Ask NOVA (demo helper): skills, careers, next challenge, progress');if(!q)return;
 const t=q.toLowerCase();let a;
 if(!u)a='Sign up first so I can look at your progress.';
 else if(/career/.test(t))a='Open Opportunities > Career directions for options based on your Skill DNA.';
 else if(/next|challenge/.test(t))a='Try: '+(CH.find(c=>!u.done.includes(c.id))||{t:'a harder challenge'}).t+'.';
 else if(/progress|xp|level/.test(t))a=`You have ${u.xp} XP, level ${ulevel(u.xp)}, ${u.done.length} challenges done.`;
 else a='Pick one skill, finish a challenge in it, then add the result to your portfolio. Small, repeated steps win.';
 alert('NOVA: '+a+'\n\n(Demo helper only. Real AI chat needs a backend API.)')}

/* ---------- shell ---------- */
const NAV=[['home','⌂','Home'],['discover','✦','Discover'],['learn','▶','Learn'],['create','✎','Create'],['opp','◎','Opportunities'],['profile','☺','Profile']];
function render(){
 if(tm&&!(tab==='learn'&&String(sub).startsWith('L'))){clearInterval(tm);tm=null;si=0}
 const V={home:vHome,auth:vAuth,discover:vDiscover,learn:vLearn,create:vCreate,opp:vOpp,profile:vProfile,call:vCall};
 document.getElementById('app').innerHTML=(tab!=='home'&&tab!=='auth'?`<div class="row" style="margin-bottom:6px">${logoSm()}<span class="mut">${me()?esc(me().name):''}</span></div>`:'')+V[tab]();
 document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');
 const q=document.getElementById('q');if(q){q.oninput=e=>{window._q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}}
}
render();
</script></body></html>
